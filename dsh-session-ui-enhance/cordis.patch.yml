# dsh-session-ui-enhance bundle patch: mounts the composition row that
# activates the session UI enhancements in the web GUI. Applied when a
# profile lists this bundle in dsh.profile.bundles; a profile's own
# cordis.patch.yml may override this row by id (patch replaces the targeted
# row's whole config).
#
# The host half serves the mermaid client-config snapshot
# (/plugins/dsh-session-ui-enhance/client-config); everything else (rail,
# typography, code-block chrome, mermaid cards rendered locally via
# mermaid.js) is browser UI in the `./client` bundle. Tunables come from the
# Config schema defaults (see README); override this row's config by id in a
# profile cordis.patch.yml.
- insert:
    - id: session-ui-enhance
      name: dsh-session-ui-enhance
